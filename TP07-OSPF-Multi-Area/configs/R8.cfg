!
hostname R8
no ip domain lookup
!
!
interface Loopback0
 ip address 8.8.8.8 255.255.255.255
 no shutdown
 exit
!
interface Serial2/0
 ip address 10.0.7.2 255.255.255.252
 no shutdown
 exit
!
router ospf 1
 router-id 8.8.8.8
 network 8.8.8.8 0.0.0.0 area 0
 network 10.0.7.0 0.0.0.3 area 3
 area 3 nssa
 exit
!
end
write memory
!
