!
hostname R9
no ip domain lookup
!
!
interface Loopback0
 ip address 9.9.9.9 255.255.255.255
 no shutdown
 exit
!
interface Serial2/0
 ip address 10.0.8.2 255.255.255.252
 no shutdown
 exit
!
router ospf 1
 router-id 9.9.9.9
 network 9.9.9.9 0.0.0.0 area 0
 network 10.0.8.0 0.0.0.3 area 3
 area 3 nssa
 exit
!
end
write memory
!
