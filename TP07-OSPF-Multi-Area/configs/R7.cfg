!
hostname R7
no ip domain lookup
!
!
interface Loopback0
 ip address 7.7.7.7 255.255.255.255
 no shutdown
 exit
!
interface Serial2/0
 ip address 10.0.6.2 255.255.255.252
 no shutdown
 exit
!
router ospf 1
 router-id 7.7.7.7
 network 7.7.7.7 0.0.0.0 area 0
 network 10.0.6.0 0.0.0.3 area 2
 area 2 stub
 exit
!
end
write memory
!
