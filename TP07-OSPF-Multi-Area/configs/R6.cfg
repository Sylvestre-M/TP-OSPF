!
hostname R6
no ip domain lookup
!
!
interface Loopback0
 ip address 6.6.6.6 255.255.255.255
 no shutdown
 exit
!
interface Serial2/0
 ip address 10.0.5.2 255.255.255.252
 no shutdown
 exit
!
router ospf 1
 router-id 6.6.6.6
 network 6.6.6.6 0.0.0.0 area 0
 network 10.0.5.0 0.0.0.3 area 1
 exit
!
end
write memory
!
