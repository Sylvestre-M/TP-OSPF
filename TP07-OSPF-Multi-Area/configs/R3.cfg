!
hostname R3
no ip domain lookup
!
!
interface Loopback0
 ip address 3.3.3.3 255.255.255.255
 no shutdown
 exit
!
interface Serial2/0
 ip address 10.0.0.2 255.255.255.252
 no shutdown
 exit
!
interface Serial2/1
 ip address 10.0.1.2 255.255.255.252
 no shutdown
 exit
!
router ospf 1
 router-id 3.3.3.3
 network 3.3.3.3 0.0.0.0 area 0
 network 10.0.0.0 0.0.0.3 area 0
 network 10.0.1.0 0.0.0.3 area 0
 exit
!
end
write memory
!
