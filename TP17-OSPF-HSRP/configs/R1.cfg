hostname R1
no ip domain lookup
!
interface Ethernet0/0
 description LAN VLAN10 / HSRP
 ip address 192.168.10.252 255.255.255.0
 no shutdown
 standby 10 ip 192.168.10.254
 standby 10 priority 110
 standby 10 preempt
!
! Interfaces de transit : compléter selon le câblage GNS3
!
router ospf 1
 router-id 1.1.1.1
 network 192.168.10.0 0.0.0.255 area 0
!
end
