! TP10 - Configuration Cisco IOS
! Ne contient pas de credentials.
! Etape: OSPF/RIP + redistribution OSPF -> RIP sur ASBR.

hostname R2
no ip domain-lookup

interface Serial2/0
 ip address 10.0.1.2 255.255.255.252
 no shutdown
interface Serial2/1
 ip address 10.0.5.2 255.255.255.252
 no shutdown
interface Serial2/2
 ip address 10.0.4.2 255.255.255.252
 no shutdown
interface Serial2/3
 ip address 10.0.7.1 255.255.255.252
 no shutdown

router ospf 1
 router-id 2.2.2.2
 network 10.0.1.0 0.0.0.3 area 0
 network 10.0.4.0 0.0.0.3 area 0
 network 10.0.5.0 0.0.0.3 area 0
 network 10.0.7.0 0.0.0.3 area 0
