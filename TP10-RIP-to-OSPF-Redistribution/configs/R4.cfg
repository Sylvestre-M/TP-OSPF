! TP10 - Configuration Cisco IOS
! Ne contient pas de credentials.
! Etape: OSPF/RIP + redistribution OSPF -> RIP sur ASBR.

hostname R4
no ip domain-lookup

interface Serial2/0
 ip address 10.0.6.2 255.255.255.252
 no shutdown
interface Serial2/1
 ip address 10.0.5.1 255.255.255.252
 no shutdown
interface Serial2/2
 ip address 10.0.2.2 255.255.255.252
 no shutdown
interface Serial2/3
 ip address 10.0.8.1 255.255.255.252
 no shutdown

router ospf 1
 router-id 4.4.4.4
 network 10.0.2.0 0.0.0.3 area 0
 network 10.0.5.0 0.0.0.3 area 0
 network 10.0.6.0 0.0.0.3 area 0
 network 10.0.8.0 0.0.0.3 area 0
