! TP10 - Configuration Cisco IOS
! Ne contient pas de credentials.
! Etape: OSPF/RIP + redistribution OSPF -> RIP sur ASBR.

hostname ASBR
no ip domain-lookup

interface Serial2/0
 ip address 10.0.7.2 255.255.255.252
 no shutdown
interface Serial2/1
 ip address 10.0.8.2 255.255.255.252
 no shutdown
interface Serial2/2
 ip address 10.0.9.2 255.255.255.252
 no shutdown
interface Serial2/3
 ip address 10.0.10.2 255.255.255.252
 no shutdown

router ospf 1
 router-id 5.5.5.5
 network 10.0.7.0 0.0.0.3 area 0
 network 10.0.8.0 0.0.0.3 area 0

router rip
 version 2
 no auto-summary
 network 10.0.0.0
 redistribute ospf 1 metric 2
