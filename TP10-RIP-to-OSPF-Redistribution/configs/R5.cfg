! TP10 - Configuration Cisco IOS
! Ne contient pas de credentials.
! Etape: OSPF/RIP + redistribution OSPF -> RIP sur ASBR.

hostname R5
no ip domain-lookup

interface Serial2/0
 ip address 10.0.11.2 255.255.255.252
 no shutdown
interface Serial2/1
 ip address 10.0.14.2 255.255.255.252
 no shutdown

router rip
 version 2
 no auto-summary
 network 10.0.0.0
